version: "3.9"

services:
  # ---- TrendFlow API + frontend ----
  api:
    build:
      context: .
      target: runtime
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # ---- Development only: hot-reload server + Vite ----
  dev:
    image: node:23-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev
