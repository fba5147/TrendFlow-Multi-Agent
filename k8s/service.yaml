apiVersion: v1
kind: Service
metadata:
  name: trendflow
  namespace: default
  labels:
    app: trendflow
spec:
  selector:
    app: trendflow
  ports:
    - name: http
      port: 80
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
---
# Expose externally via Ingress (preferred) or change type to LoadBalancer
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trendflow
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - your-domain.com
      secretName: trendflow-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trendflow
                port:
                  number: 80
